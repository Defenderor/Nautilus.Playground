<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MOTD Server</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Задний фон с красивым голубым размытием */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #00b4d8;
            filter: blur(120px);
            top: 20%;
            left: 30%;
            z-index: 1;
        }

        .container {
            width: 85%;
            height: 85%;
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            z-index: 2;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Шапка */
        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

            .header h1 {
                font-size: 28px;
                color: #00b4d8;
                text-shadow: 0 0 10px rgba(0, 180, 216, 0.5);
            }

        /* Контентная зона */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Область с фреймом */
        .content {
            flex: 1;
            padding: 0;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="header">
            <h1>ДОБРО ПОЖАЛОВАТЬ НА "Nautilus Playground"!</h1>
        </div>

            
            <div class="content">
                <iframe id="content-frame" src="about:blank"></iframe>
            </div>
        </div>

    </div>

    <script>
        const googleDocsUrl = "https://docs.google.com/document/d/1QQCAtCQseU4rP0nEbR0-bg8P-sl_w4jWeYiWpyV47zo/edit?tab=t.0";
        const frame = document.getElementById('content-frame');


        // Загружаем главную при старте
        frame.removeAttribute('srcdoc');
        frame.src = googleDocsUrl;
    </script>
</body>
</html>
